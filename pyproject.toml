[project]
name = "chatgpt-pool-ng"
version = "1.9.1+ng"
description = "ChatGPT account pool with egress governance, account health and observability"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.15.0",
    "fastapi>=0.136.0",
    "pillow>=12.2.0",
    "pybase64>=1.4.3",
    "python-multipart>=0.0.26",
    "tiktoken>=0.12.0",
    "uvicorn>=0.44.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "gitpython>=3.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
markers = [
    "live: 需要真实上游的集成测试，会消耗真实账号额度（需 CHATGPT2API_LIVE=1）",
]
# 兜底超时：上游 SSE 不结束时客户端会一直等，没有上限整套测试就挂死了。
timeout = 300
timeout_method = "thread"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
