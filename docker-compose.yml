# chatgpt-pool-ng —— 一个项目的三个部分。
#
# app         : Python 网关 + Next.js 控制台（chatgpt2api 基座）
# grok2api    : Go 号池网关，源码在 upstreams/grok2api
# minimax2api : Go 号池网关，源码在 upstreams/minimax2api
#
# 三个服务在同一个 compose 项目、同一个网络里，用服务名互相访问。
# 一条 `docker compose up -d` 起全套。

name: chatgpt-pool-ng

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chenjuanjuan055-ai/chatgpt-pool-ng:latest
    container_name: chatgpt-pool-ng
    restart: unless-stopped
    ports:
      - "${CHATGPT_POOL_PORT:-3000}:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 存储后端配置 (可选值: json, sqlite, postgres, git)
      STORAGE_BACKEND: json
      # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
      # DATABASE_URL=postgresql://user:password@host:5432/dbname
      # DATABASE_URL=sqlite:///app/data/accounts.db
      # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
      # GIT_REPO_URL=https://github.com/user/repo.git
      # GIT_TOKEN=ghp_xxxxxxxxxxxx
      # GIT_BRANCH=main
      # GIT_FILE_PATH=accounts.json
      # 认证密钥 (可选，覆盖 config.json)
      # CHATGPT2API_AUTH_KEY=your_secret_key
      # 基础 URL (可选)
      # CHATGPT2API_BASE_URL=https://your-domain.com
      # 上游号池地址：容器里用服务名，不用 127.0.0.1
      GROK2API_BASE_URL: http://grok2api:8002
      MINIMAX_BASE_URL: http://minimax2api:8096
      # MINIMAX_ADMIN_USER / MINIMAX_ADMIN_PASSWORD 不设时读 data/minimax_console.json
    depends_on:
      - grok2api
      - minimax2api
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  grok2api:
    build:
      context: ./upstreams/grok2api
      dockerfile: Dockerfile
    image: chenjuanjuan055-ai/grok2api:local
    container_name: chatgpt-pool-ng-grok2api
    restart: unless-stopped
    ports:
      - "${GROK2API_PORT:-8002}:8002"
    volumes:
      - ./upstreams/grok2api/config.yaml:/run/grok2api/config.yaml:ro
      # 直接挂本机数据目录：账号库（grok2api 是 backend.db，minimax2api 是 app.json）
      # 已经在本机备好，换成 named volume 会变成空池。
      - ./upstreams/grok2api/data:/app/data
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  minimax2api:
    build:
      context: ./upstreams/minimax2api
      dockerfile: Dockerfile
    image: chenjuanjuan055-ai/minimax2api:local
    container_name: chatgpt-pool-ng-minimax2api
    restart: unless-stopped
    ports:
      - "${MINIMAX2API_PORT:-8096}:8096"
    volumes:
      - ./upstreams/minimax2api/data:/app/data
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  grok2api-data:
  minimax2api-data:
