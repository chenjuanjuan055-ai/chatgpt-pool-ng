# 本地开发编排：一个项目的三个部分。
#
# app         : Python 网关 + Next.js 控制台
# grok2api    : Go 号池网关（upstreams/grok2api）
# minimax2api : Go 号池网关（upstreams/minimax2api）

name: chatgpt-pool-ng-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt-pool-ng:local
    container_name: chatgpt-pool-ng-local
    ports:
      - "8000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: sqlite
      DATABASE_URL: sqlite:////app/data/accounts.db
      # 上游号池地址：容器里用服务名
      GROK2API_BASE_URL: http://grok2api:8002
      MINIMAX_BASE_URL: http://minimax2api:8096
    depends_on:
      - grok2api
      - minimax2api
    # 存储后端配置 (可选: json, sqlite, postgres, git)
    # environment:
    #   STORAGE_BACKEND: json

    # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
    # DATABASE_URL=postgresql://user:password@host:5432/dbname
    # DATABASE_URL=sqlite:////app/data/accounts.db

    # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
    # GIT_REPO_URL=https://github.com/user/repo.git
    # GIT_TOKEN=ghp_xxxxxxxxxxxx
    # GIT_BRANCH=main
    # GIT_FILE_PATH=accounts.json

    # 认证密钥 (可选，覆盖 config.json)
    # CHATGPT2API_AUTH_KEY=your_secret_key

    # 基础 URL (可选)
    # CHATGPT2API_BASE_URL=https://your-domain.com

  grok2api:
    build:
      context: ./upstreams/grok2api
      dockerfile: Dockerfile
    image: chatgpt-pool-ng-grok2api:local
    container_name: chatgpt-pool-ng-local-grok2api
    ports:
      - "8002:8002"
    volumes:
      - ./upstreams/grok2api/config.yaml:/run/grok2api/config.yaml:ro
      - ./upstreams/grok2api/data:/app/data

  minimax2api:
    build:
      context: ./upstreams/minimax2api
      dockerfile: Dockerfile
    image: chatgpt-pool-ng-minimax2api:local
    container_name: chatgpt-pool-ng-local-minimax2api
    ports:
      - "8096:8096"
    volumes:
      - ./upstreams/minimax2api/data:/app/data
